<title>Teeyan — Punjab's Monsoon Festival</title>
<meta name="description" content="The peengh, the boliyan, the month of Sawan. A scrolling record of Teeyan, the Punjabi women's festival, with the folk music that belongs to each moment.">

<meta name="color-scheme" content="dark">

<meta property="og:title" content="Teeyan — Punjab's Monsoon Festival">

<meta name="twitter:title" content="Teeyan — Punjab's Monsoon Festival">
<meta name="twitter:description" content="The peengh, the boliyan, the month of Sawan. A scrolling record of Teeyan, the Punjabi women's festival.">

<link rel="preload" href="assets/fonts/karla-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/noto-serif-gurmukhi-var.woff2" as="font" type="font/woff2" crossorigin>

<!-- The first thing anyone sees after the card. Only Sawan is preloaded; the
     other four load as they come within a viewport. The media queries match
     the <picture> in js/render.js, and type="image/webp" means a browser that
     cannot decode WebP skips the preload rather than wasting the request. -->
<link rel="preload" href="assets/art/sawan-wide.webp" as="image" type="image/webp" media="(orientation: landscape)">
<link rel="preload" href="assets/art/sawan-tall.webp" as="image" type="image/webp" media="(orientation: portrait)">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/atmosphere.css">
<link rel="stylesheet" href="css/chapters.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/title-card.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body class="is-locked">

<!-- The five backgrounds. Fixed and stacked, cross-faded by scroll position,
     so no section ever cuts to the next. Built by js/render.js. -->
<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="backdrop__tint backdrop__tint--cool" id="tint-cool"></div>
  <div class="backdrop__tint backdrop__tint--warm" id="tint-warm"></div>
  <div class="backdrop__grain"></div>
  <div class="backdrop__vignette"></div>
</div>

<main class="journey" id="journey">
  <h1 class="u-visually-hidden">Teeyan — Punjab's monsoon festival</h1>
  <!-- Sections are built by js/render.js from js/sections.js -->
</main>

<!-- Entry overlay. Dark, quiet, slow. -->
<div class="title-card" id="title-card">

  <!-- Decorative footage of the courtyard, graded well down so the card keeps
       its register. Muted and silent — the "do not autoplay" rule is about the
       music, and nothing here makes a sound. The poster carries the frame
       until the video can play, and stands in for it entirely under
       prefers-reduced-motion or if the file never loads. -->
  <div class="title-card__film" id="title-film" aria-hidden="true">
    <!-- autoplay is on the element as well as being called from JS: muted
         autoplay is permitted everywhere, and this way the footage still runs
         if the module never executes. preload="auto" because it is 2.6MB and
         it is the first thing on screen. -->
    <video id="title-video"
           poster="assets/video/teeyan-title-poster.jpg"
           autoplay muted loop playsinline preload="auto"
           disablepictureinpicture tabindex="-1">
      <source src="assets/video/teeyan-title.mp4" type="video/mp4">
    </video>
  </div>

  <div class="title-card__inner">

    <p class="title-card__wordmark">
      <svg class="wordmark" viewBox="0 0 2164 1040" role="img" aria-label="Teeyan" focusable="false">

      </svg>
      <span class="u-visually-hidden">Teeyan</span>
    </p>

    <p class="title-card__roman" aria-hidden="true">TEEYAN</p>

    <p class="title-card__tagline">The peengh, the boliyan, the month of Sawan</p>

    <p class="title-card__context">
      A women's festival held through Sawan, the monsoon month, when married
      daughters return to the villages they grew up in.
    </p>

    <button class="title-card__enter" id="enter" type="button">
      <span class="title-card__enter-label">Enter Sawan</span>
    </button>

    <!-- A real control, not a caption. Browsers will not start audio without
         a press, so rather than pretend otherwise this asks for the press and
         says what it does. It starts Sawan's music, which then carries
         straight through the entry. -->
    <p class="title-card__sound">
      <button class="title-card__sound-btn" id="sound" type="button" aria-pressed="false">
        <span class="title-card__sound-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" focusable="false">
            <path d="M3.4 6.1h2.1L8.3 3.6v8.8L5.5 9.9H3.4z"/>
            <path class="title-card__wave" d="M10.6 5.9a3 3 0 0 1 0 4.2M12.6 4.2a5.6 5.6 0 0 1 0 7.6"
                  fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="title-card__sound-label">Play the music</span>
      </button>
    </p>

    <div class="scroll-cue" id="scroll-cue" aria-hidden="true">
      <span class="scroll-cue__word">scroll</span>
      <span class="scroll-cue__line"></span>
    </div>

  </div>
</div>

    .title-card { position: static; opacity: 1; }

    Teeyan is a scrolling record of the Punjabi monsoon festival, with folk

</body>
</html>
